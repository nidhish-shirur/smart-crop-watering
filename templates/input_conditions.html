<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Input Conditions</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <div class="main-card">
      <h2 style="font-size:2.0em; color:#00796b;">Enter Conditions</h2>
      <form method="POST" autocomplete="off">
        <label for="temperature">🌡️ Temperature (°C):</label>
        <input type="number" name="temperature" id="temperature" step="0.1" required placeholder="e.g. 25.0" aria-label="Temperature">

        <label for="moisture">💧 Moisture (%):</label>
        <input type="number" name="moisture" id="moisture" step="0.1" required placeholder="e.g. 70.0" aria-label="Moisture">

        <button type="submit">Save and Predict</button>
      </form>
    </div>
  </div>
</body>
</html>
